# Redis 7 holds only short-lived data (OTP hashes, rate-limit counters), so it needs no persistent volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neernow-redis
  labels: { app.kubernetes.io/name: neernow-redis, app.kubernetes.io/part-of: neernow, app.kubernetes.io/component: cache }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: neernow-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: neernow-redis, app.kubernetes.io/part-of: neernow }
    spec:
      containers:
        - name: redis
          image: quay.io/sclorg/redis-7-c9s
          ports: [{ name: redis, containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: neernow-secrets, key: REDIS_PASSWORD } }
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: data, mountPath: /var/lib/redis/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neernow-redis
  labels: { app.kubernetes.io/name: neernow-redis, app.kubernetes.io/part-of: neernow }
spec:
  selector: { app.kubernetes.io/name: neernow-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
