# Scale API and web with CPU load (summer peaks), and keep at least one pod up during node maintenance.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neernow-api
  labels: { app.kubernetes.io/part-of: neernow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: neernow-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neernow-web
  labels: { app.kubernetes.io/part-of: neernow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: neernow-web }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neernow-api
  labels: { app.kubernetes.io/part-of: neernow }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: neernow-api } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neernow-web
  labels: { app.kubernetes.io/part-of: neernow }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: neernow-web } }
