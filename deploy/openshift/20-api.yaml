# NeerNow API: internal only (no route). Reached by the web app through the neernow-api service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neernow-api
  labels: { app.kubernetes.io/name: neernow-api, app.kubernetes.io/part-of: neernow, app.kubernetes.io/component: api }
  annotations:
    # Roll out automatically when a new image is built into the neernow-api image stream.
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"neernow-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]'
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: neernow-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: neernow-api, app.kubernetes.io/part-of: neernow }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/name: neernow-api } }
      containers:
        - name: api
          image: neernow-api:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: neernow-secrets, key: POSTGRESQL_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: neernow-secrets, key: REDIS_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://neernow:$(POSTGRESQL_PASSWORD)@neernow-postgres:5432/neernow" }
            - { name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@neernow-redis:6379/0" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: neernow-secrets, key: JWT_SECRET } }
            - name: HASH_KEY
              valueFrom: { secretKeyRef: { name: neernow-secrets, key: HASH_KEY } }
            - name: DATA_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: neernow-secrets, key: DATA_ENCRYPTION_KEY } }
          envFrom:
            - configMapRef: { name: neernow-config }
            - secretRef: { name: neernow-sms, optional: true }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neernow-api
  labels: { app.kubernetes.io/name: neernow-api, app.kubernetes.io/part-of: neernow }
spec:
  selector: { app.kubernetes.io/name: neernow-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
