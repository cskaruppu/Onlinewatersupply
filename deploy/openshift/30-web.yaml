# NeerNow web app (Next.js). The only component exposed to the internet, through the neernow route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neernow-web
  labels: { app.kubernetes.io/name: neernow-web, app.kubernetes.io/part-of: neernow, app.kubernetes.io/component: web }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"neernow-web:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]'
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: neernow-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: neernow-web, app.kubernetes.io/part-of: neernow }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/name: neernow-web } }
      containers:
        - name: web
          image: neernow-web:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: API_INTERNAL_URL, value: "http://neernow-api:3001" }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: neernow-web
  labels: { app.kubernetes.io/name: neernow-web, app.kubernetes.io/part-of: neernow }
spec:
  selector: { app.kubernetes.io/name: neernow-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
