name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests (unit + end-to-end with PostgreSQL and Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: quay.io/sclorg/postgresql-16-c9s
        env:
          POSTGRESQL_USER: neernow
          POSTGRESQL_PASSWORD: ci-pass
          POSTGRESQL_DATABASE: neernow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -q" --health-interval 3s --health-retries 20
      redis:
        image: quay.io/sclorg/redis-7-c9s
        env:
          REDIS_PASSWORD: ci-redis
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli -a ci-redis --no-auth-warning ping" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://neernow:ci-pass@localhost:5432/neernow
      TEST_REDIS_URL: redis://:ci-redis@localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  scripts:
    name: Shell scripts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning deploy/openshift/*.sh scripts/*.sh
      - run: python3 -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('deploy/openshift/*.yaml')]"
